# NeuroFusion AI - Default Configuration
# All hyperparameters, paths, and model configs

app:
  name: "NeuroFusion AI"
  version: "1.0.0"
  tagline: "AI-Powered MRI Enhancement & Intelligent Disease Localization"
  debug: true
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://127.0.0.1:5173"

paths:
  dataset_dir: "./dataset"
  brain_dir: "./dataset/brain"
  weights_dir: "./weights"
  outputs_dir: "./outputs"
  reports_dir: "./reports"
  logs_dir: "./logs"
  temp_dir: "./temp"

upload:
  max_file_size_mb: 2048
  allowed_extensions:
    - ".nii"
    - ".nii.gz"
  chunk_size_mb: 10

# BraTS 2020 Dataset Configuration
dataset:
  brats2020:
    name: "BraTS2020"
    description: "Brain Tumor Segmentation 2020 Challenge Dataset"
    kaggle_slug: "awsaf49/brats20-dataset-training-validation"
    modalities:
      - "t1"
      - "t1ce"
      - "t2"
      - "flair"
    labels:
      0: "Background"
      1: "Necrotic/Non-enhancing Tumor Core (NCR/NET)"
      2: "Peritumoral Edema (ED)"
      4: "GD-Enhancing Tumor (ET)"
    regions:
      whole_tumor: [1, 2, 4]
      tumor_core: [1, 4]
      enhancing_tumor: [4]
    voxel_spacing: [1.0, 1.0, 1.0]
    image_size: [240, 240, 155]

preprocessing:
  # Bias Field Correction
  bias_correction:
    method: "N4"
    shrink_factor: 3
    convergence_threshold: 0.001
    max_iterations: [50, 50, 30, 20]

  # Resampling
  resampling:
    target_spacing: [1.0, 1.0, 1.0]
    interpolation: "linear"
    label_interpolation: "nearest"

  # Normalization
  normalization:
    method: "zscore"  # zscore, minmax, percentile
    percentile_lower: 0.5
    percentile_upper: 99.5

  # Skull Stripping
  skull_stripping:
    method: "threshold"  # threshold, atlas, deep_learning
    threshold_percentile: 2

  # Filters
  clahe:
    clip_limit: 3.0
    grid_size: 8
  
  median_filter:
    kernel_size: 3
  
  gaussian_filter:
    sigma: 1.0
  
  nlm_filter:
    patch_size: 5
    patch_distance: 6
    h: 0.1
  
  anisotropic_diffusion:
    n_iterations: 10
    kappa: 50
    gamma: 0.1

# Augmentation
augmentation:
  rotation_range: 15
  elastic_alpha: 100
  elastic_sigma: 10
  gamma_range: [0.7, 1.5]
  brightness_range: [-0.1, 0.1]
  contrast_range: [0.9, 1.1]
  flip_axes: [0, 1, 2]
  scale_range: [0.9, 1.1]

# Enhancement Models
enhancement:
  default_model: "clahe"
  models:
    clahe:
      clip_limit: 3.0
      grid_size: 8
    restormer:
      dim: 48
      num_blocks: [4, 6, 6, 8]
      heads: [1, 2, 4, 8]
      ffn_expansion_factor: 2.66
      bias: false
      layer_norm_type: "WithBias"
    swinir:
      img_size: 64
      patch_size: 1
      in_chans: 1
      embed_dim: 180
      depths: [6, 6, 6, 6, 6, 6]
      num_heads: [6, 6, 6, 6, 6, 6]
      window_size: 8
      mlp_ratio: 2.0
      upscale: 1
      img_range: 1.0
      upsampler: ""
      resi_connection: "1conv"
    mirnet:
      in_channels: 1
      out_channels: 1
      n_feat: 64
      kernel_size: 3
      stride: 2
      n_rrg: 3
      n_mrb: 2
      height: 3
      width: 2

# Segmentation Models
segmentation:
  default_model: "unet"
  models:
    unet:
      in_channels: 4
      out_channels: 4
      features: [64, 128, 256, 512]
    unet_plus:
      in_channels: 4
      out_channels: 4
      features: [64, 128, 256, 512]
    attention_unet:
      in_channels: 4
      out_channels: 4
      features: [64, 128, 256, 512]
    unet3d:
      in_channels: 4
      out_channels: 4
      features: [32, 64, 128, 256]
    swin_unetr:
      img_size: [128, 128, 128]
      in_channels: 4
      out_channels: 4
      feature_size: 48
      use_checkpoint: true

# Training
training:
  batch_size: 2
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.00001
  max_epochs: 300
  val_interval: 2
  early_stopping_patience: 30
  
  # Mixed Precision
  use_amp: true
  
  # Gradient Accumulation
  grad_accumulation_steps: 4
  
  # Optimizer
  optimizer: "AdamW"
  
  # Scheduler
  scheduler: "cosine_annealing"
  scheduler_params:
    T_max: 300
    eta_min: 0.0000001
  
  # Patch-based training
  patch_size: [128, 128, 128]
  pos_sample_num: 1
  neg_sample_num: 1
  
  # Checkpointing
  save_best: true
  save_last: true
  checkpoint_dir: "./weights/checkpoints"

# Evaluation Metrics
evaluation:
  enhancement_metrics:
    - "psnr"
    - "ssim"
    - "mse"
    - "rmse"
    - "lpips"
    - "fsim"
    - "brisque"
    - "niqe"
    - "piqe"
    - "uqi"
    - "entropy"
  
  segmentation_metrics:
    - "dice"
    - "iou"
    - "accuracy"
    - "precision"
    - "recall"
    - "sensitivity"
    - "specificity"
    - "f1"
    - "hausdorff_distance"
    - "average_surface_distance"

# GPU Configuration
gpu:
  device: "auto"  # auto, cpu, cuda, cuda:0
  memory_fraction: 0.9
  benchmark: true
  deterministic: false
  seed: 42
